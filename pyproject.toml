[project]
name = "template-menu-mariage"
version = "2.0.0"
description = "Template pour composer un menu de mariage prêt à imprimer"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["mariage", "menu", "impression", "pdf", "typographie"]

dependencies = [
    "PyYAML>=6.0",
    "PyMuPDF>=1.24",
]

[project.urls]
Homepage = "https://github.com/dsebastien/template-menu-mariage"
Documentation = "https://github.com/dsebastien/template-menu-mariage/tree/main/docs"
